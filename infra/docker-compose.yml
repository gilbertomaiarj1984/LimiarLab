# Projeto 100% isolado (prefixo limiarlab): app, Postgres PRÓPRIO e backup num compose só.
# Nada aqui toca nos outros apps da VPS: não usa o Postgres do garimpo, não cria nem altera
# redes ou volumes deles. Sem portas publicadas. O único ponto de contato é a rede externa
# `proxy`, que já existe e na qual o app entra para o Caddy alcançá-lo (como o AgendaBoa faz).
# Rodar SEMPRE de dentro de /opt/limiarlab. Passos em infra/README.md.
name: limiarlab

services:
  postgres:
    container_name: limiarlab-postgres
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: limiarlab
      POSTGRES_DB: limiarlab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
    # Parâmetros baixos de propósito: a VPS é compartilhada e o banco é pequeno.
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=20", "-c", "work_mem=4MB"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U limiarlab -d limiarlab"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      db: {}

  app:
    container_name: limiarlab-app
    image: ${APP_IMAGE:-ghcr.io/gilbertomaiarj1984/limiarlab:latest}
    restart: unless-stopped
    env_file: .env.production        # fica só na VPS, nunca no git
    environment:
      DATABASE_URL: postgresql://limiarlab:${POSTGRES_PASSWORD}@limiarlab-postgres:5432/limiarlab
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 200
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      proxy:
        # Alias único: `app` é nome comum e já existe em outros projetos na rede `proxy`.
        aliases: [limiarlab-app]
      db: {}

  # Backup diário do banco (pg_dump -> volume local, retenção de 14 dias).
  backup:
    container_name: limiarlab-backup
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://limiarlab:${POSTGRES_PASSWORD}@limiarlab-postgres:5432/limiarlab
    entrypoint: ["sh", "/backup.sh"]
    volumes:
      - ./backup.sh:/backup.sh:ro
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 64m
    cpus: 0.2
    pids_limit: 50
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks:
      db: {}

volumes:
  pgdata:
  backups:

networks:
  # Rede própria do projeto (criada e removida pelo próprio compose; só os 3 serviços daqui).
  db:
  # Já existe na VPS (criada para o Caddy). Só entramos nela; não é criada nem alterada aqui.
  proxy:
    external: true
