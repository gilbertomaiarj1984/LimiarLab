# App web (pasta web/). Em PR: testes, checagem de tipos e build da imagem, sem publicar.
# Na main: publica a imagem no GHCR. A VPS nunca builda; só faz `docker compose pull && up -d`
# (ver infra/README.md). Mesmo modelo do AgendaBoa.
name: web

on:
  push:
    branches: [main]
    paths: ["web/**", "infra/**", ".github/workflows/web.yml"]
  pull_request:
    branches: [main]
    paths: ["web/**", "infra/**", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  image:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Número do PR da versão (merge "Merge pull request #N" ou squash "(#N)"); a mensagem entra por env, nunca inline.
      - id: ver
        env:
          MSG: ${{ github.event.head_commit.message }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          pr="$PR_NUMBER"
          if [ -z "$pr" ]; then
            pr=$(printf '%s' "$MSG" | head -n1 | grep -oE '(#|pull request #)[0-9]+' | head -n1 | grep -oE '[0-9]+' || true)
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: web
          build-args: |
            APP_COMMIT=${{ github.sha }}
            APP_PR=${{ steps.ver.outputs.pr }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/gilbertomaiarj1984/limiarlab:latest
            ghcr.io/gilbertomaiarj1984/limiarlab:${{ github.sha }}
